services:
  - type: web
    name: nepal-egov-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_SETUP_CODE
        sync: false
      # To keep data across deploys (paid plans), attach a disk mounted at /var/data
      # and uncomment:
      # - key: DATA_DIR
      #   value: /var/data
